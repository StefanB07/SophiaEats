name: CI All Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  backend-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend full test suite (unit + integration + cucumber)
        run: mvn -B clean verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          retention-days: 7

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npx eslint . --max-warnings=999

      - name: Frontend tests
        env:
          CI: true
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build & (optional) coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: |
            frontend/dist
            frontend/coverage
          retention-days: 7
